[package]
name = "net_surgeon"
version = "0.7.4"
edition = "2024"
# Минимальная версия: let-chains (`if let … && let …`) стабильны с 1.88.
rust-version = "1.88"
license = "MIT"

# Ядро вынесено в библиотеку, бинарь — тонкая обёртка над ней.
#
# Так его можно собрать отдельно от интерфейса: под Android нужен только
# SOCKS5-сервер, подключённый к VpnService, и ни терминал, ни разбор
# аргументов там не нужны. Из бинарного крейта достать это было нельзя.
[lib]
name = "net_surgeon"
path = "src/lib.rs"

[[bin]]
name = "net_surgeon"
path = "src/main.rs"

# Трей-иконка (только Linux-десктоп): вкл/выкл фоновой службы одним кликом.
# Собирается лишь с feature `tray`, поэтому в обычную сборку, на сервер и на
# Android не попадает вместе с GUI-зависимостью.
[[bin]]
name = "net_surgeon-tray"
path = "src/bin/tray.rs"
required-features = ["tray"]

# Пробный пакетный обход на Linux через NFQUEUE — аналог nfqws из zapret.
# Тонкая обёртка над crate::nfqueue для проверки seqovl на живом трафике.
# Собирается только под Linux (на других системах — заглушка).
[[example]]
name = "nfqws_seqovl"

[features]
default = ["tui"]
# Терминальный интерфейс. Выключается вместе со своими зависимостями:
# ratatui и crossterm на сервере и на Android не нужны и только удлиняют
# сборку. Без него работает режим --headless.
tui = ["dep:ratatui", "dep:crossterm"]
# Трей-иконка Linux (бинарь net_surgeon-tray): вкл/выкл фоновой службы одним
# кликом через StatusNotifierItem. ksni — чистый Rust поверх D-Bus, без GTK;
# тянется только с этим флагом, в ядро и на Android не попадает.
tray = ["dep:ksni"]

[dependencies]
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
tokio-util = "0.7.18"
chrono = "0.4.45"
toml_edit = "0.25.12"
rust-i18n = "4.1.0"
libc = "0.2.186"
reqwest = "0.13.4"
# Ретранслятор Telegram (src/proxy/telegram.rs): TLS до воркера Cloudflare.
# rustls и tokio-rustls уже приходят с reqwest, так что сборка не растёт;
# корни встроенные — на Android до системного хранилища из Rust не добраться.
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "1"
base64 = "0.22"

ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

# Трей через StatusNotifierItem (feature `tray`, бинарь net_surgeon-tray).
# Только Linux-десктоп; на других системах флаг просто не включают.
ksni = { version = "0.2", optional = true }

# Пакетный обход на Linux (src/nfqueue.rs): чтение NFQUEUE через netlink,
# без C-зависимостей. Только под Linux (не Android): там нет ни root, ни
# очереди, и режим не включается.
[target.'cfg(target_os = "linux")'.dependencies]
nfq = "0.2.5"

# Техники обхода на Windows (src/bypass/socket.rs): TTL и OOB через Winsock.
# Обе библиотеки уже приходят с tokio, так что сборка от них не растёт.
[target.'cfg(windows)'.dependencies]
socket2 = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    # Прозрачный режим (src/windivert): WinDivert.dll подгружается во время
    # работы, а владелец соединения ищется в таблице сокетов системы.
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_LibraryLoader",
    # Системный прокси (src/system_proxy.rs): реестр, уведомление
    # программ об изменении и закрытие окна консоли.
    "Win32_Networking_WinInet",
    "Win32_System_Console",
    "Win32_System_Registry",
] }

# Сборка по размеру: 11,6 МБ → 4,5 МБ. Прокси упирается в сеть, а не
# в процессор, так что оптимизация по размеру вместо скорости незаметна.
#
# `panic = "abort"` сэкономил бы ещё 0,5 МБ, но намеренно не включён: сейчас
# паника в обработчике одного соединения убивает только его задачу tokio,
# а с abort она роняла бы весь прокси вместе с остальными соединениями.
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
