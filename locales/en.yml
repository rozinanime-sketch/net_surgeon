verdict.connect_fail: "the TCP connection to the server was not established"
verdict.alert: "the server answered the ClientHello with a TLS alert"
verdict.server_reset: "reset from the server side (RST) after data was exchanged: more likely the server itself, though DPI is possible"
verdict.server_reset_early: "reset from the server side (RST) within the first kilobytes — the usual DPI pattern"
verdict.blackhole: "the server did not acknowledge even the ClientHello and the kernel retransmitted in vain — the connection is blackholed"
verdict.unanswered_retrans: "the handshake completed, but the server never acknowledged the client data and the kernel retransmitted in vain — data does not get through"
verdict.dpi_redirect: "a redirect to another site instead of an answer: looks like an ISP block page"
verdict.not_tls: "not TLS — handshake stages are not visible"
verdict.no_reply: "not a single byte came back to the ClientHello"
verdict.handshake_unfinished: "the server answered, but the client did not finish the TLS handshake (no Finished sent)"
verdict.unanswered: "the handshake completed, but the server stayed silent to the client's data until the end; without a traffic capture this may be DPI or the app"
verdict.closed_early: "the client sent data and closed without waiting for an answer — nothing to judge"
verdict.handshake_sized: "the server sent the last data, but no more than a handshake takes (≤4 KB): there may have been no app response"
verdict.ok: "the handshake completed and the server sent the last data"
verdict.ok_past_freeze: "the handshake completed and data flowed well past the DPI freeze threshold"
