# Проверки, которые гоняются на каждый push и pull request.
#
# Зачем: clippy и тесты легко прогнать руками, но ровно поэтому их и
# забывают прогнать перед тем, как что-то отправить. CI забывать не умеет.
#
# Чего здесь намеренно НЕТ: `cargo fmt --check`. Код отформатирован вручную
# (выровненные литералы, длинные строки логов), rustfmt это переломает, а
# гонять его насильно ради единообразия смысла нет — компилятору всё равно.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Раз в неделю фаззер работает дольше: на коротких прогонах он успевает
    # только пощупать поверхность, а редкие пути находит за минуты.
    - cron: '17 4 * * 1'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: clippy и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # -D warnings: любое предупреждение валит сборку. Проект сейчас
      # полностью чистый, и планка держится только так — иначе
      # предупреждения копятся, пока их не перестают читать.
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: тесты
        run: cargo test --all-features

      # Ядро обязано собираться и проходить тесты без интерфейса: так его
      # собирают под сервер и под Android. Сломать это легко одним `use`,
      # и локально этого не видно, потому что по умолчанию tui включён.
      - name: сборка и тесты без интерфейса
        run: cargo test --no-default-features

      # Релиз для Linux собирается статически под musl, чтобы работать на
      # любом дистрибутиве. aws-lc (криптография rustls) там собирается
      # своим C-компилятором, musl-gcc, и сломаться может незаметно.
      - name: установить musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: тесты статической сборки (musl)
        run: cargo test --target x86_64-unknown-linux-musl

  # README обещает сборку на Rust из `rust-version` в Cargo.toml, а все
  # остальные задачи идут на свежем stable и не заметят, если код начнёт
  # требовать новее. clippy здесь нет: его правила меняются от версии к
  # версии, а обещание касается только сборки. Версию менять вместе с
  # Cargo.toml.
  msrv:
    name: сборка и тесты на Rust 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.88

      - uses: Swatinem/rust-cache@v2

      - name: тесты
        run: cargo test --all-features

  # На Windows нет прозрачного режима, а сокеты устроены иначе (SOCKET
  # вместо номера файла, Winsock вместо libc). Сломать сборку там легко
  # одним `as_raw_fd`, и с Linux этого не видно.
  windows:
    name: clippy и тесты на Windows
    runs-on: windows-latest
    env:
      # aws-lc (криптография rustls) на x86_64 хочет NASM, которого на
      # раннере нет. Готовые объектные файлы из самого крейта его заменяют.
      AWS_LC_SYS_PREBUILT_NASM: 1
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: тесты
        run: cargo test --all-features

  fuzz:
    name: фаззинг разборщиков
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # libFuzzer живёт только в nightly — сам проект при этом остаётся
      # на stable, фаззер лежит отдельным крейтом в fuzz/.
      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            fuzz -> fuzz/target

      - name: установить cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: сколько времени давать каждой цели
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "FUZZ_SECONDS=600" >> "$GITHUB_ENV"
          else
            echo "FUZZ_SECONDS=60" >> "$GITHUB_ENV"
          fi

      - name: прогон
        run: |
          for target in $(cargo +nightly fuzz list); do
            echo "::group::$target"
            cargo +nightly fuzz run "$target" -- \
              -max_total_time="$FUZZ_SECONDS" \
              -max_len=4096 \
              -print_final_stats=1
            echo "::endgroup::"
          done

      # Упавший вход — это файл с байтами, на которых разборщик сломался.
      # Без него падение невоспроизводимо, поэтому забираем его из CI.
      - name: сохранить упавшие входы
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
