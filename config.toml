# На каком адресе слушать все прокси-порты.
#
# 127.0.0.1 — только с этой машины. Здесь пять слушателей вообще без
# аутентификации (HTTP-прокси, SOCKS5, SOCKS5-UDP, DNS-релей, прозрачный
# режим), поэтому 0.0.0.0 означает открытый прокси для всей локальной сети,
# а UDP-слушатели вдобавок работают отражателем для усиления трафика.
#
# Прозрачному режиму localhost не мешает: правило iptables стоит в цепочке
# OUTPUT, и REDIRECT там заворачивает на 127.0.0.1.
#
# Ставьте 0.0.0.0, только если прокси нужен другим машинам, — и тогда
# закрывайте порты файрволом.
listen_host = "127.0.0.1"

port = 1080
# Порт DoH-релея. 0 — выключить.
#
# Полезен не столько как DNS, сколько тем, что наполняет кэш «адрес → домен»:
# по нему HTTPS-туннель и прозрачный режим включают обход, когда клиент
# пришёл по IP или без SNI.
udp_port = 8081
socks5_port = 1081
socks5_udp_port = 1082

# Прозрачный режим: приложения не нужно настраивать вообще. 0 — выключен.
# Требует правила iptables (см. setup-transparent.sh) и работает только в Linux.
transparent_port = 1083

# Только Windows: на время работы программа сама прописывает себя системным
# прокси (как «Параметры → Сеть и Интернет → Прокси-сервер»), а при выходе
# возвращает прежние настройки. Браузеры берут прокси оттуда, так что
# настраивать ничего не нужно. false — прописывать прокси вручную.
system_proxy = true
enabled = true
# Провайдер DoH. Используется и релеем на 8081, и резолвером (если включён).
#
# ВАЖНО про выбор провайдера, если включаете resolve_via_doh:
# Cloudflare по своей документации НЕ отправляет EDNS Client Subnet — это
# осознанная позиция ради приватности. Из-за этого CDN отвечает узлом,
# оптимальным для Cloudflare, а не для вас: на проверке x.com и meduza.io
# переставали открываться именно поэтому.
#
# Google Public DNS, наоборот, опирается на ECS для геолокации, поэтому
# здесь он.
doh_provider = "https://dns.google/dns-query"

# Адрес самого DoH-провайдера. Пустая строка (или отсутствие строки) —
# обычное поведение: имя провайдера резолвит система.
#
# Нужен, если DNS завёрнут на наш же релей — `run.sh` делает это правилом
# iptables на UDP/53, чтобы шифрованный DNS работал во всех приложениях без
# настройки в каждом. Тогда получается круг: чтобы ответить на первый запрос,
# релею надо узнать адрес провайдера — у самого себя. Здесь этот адрес задан
# заранее, и круг разрывается.
#
# Узнать адрес: getent ahostsv4 dns.google
doh_bootstrap_ip = "8.8.8.8"

# Умный DNS — только для доменов из smart_dns_domains.txt: нейросетей,
# которые сами закрыты для России по IP. Он отвечает на них адресами своих
# серверов за границей. Остальные сайты идут через doh_provider выше, так
# что умный DNS не узнаёт, что ещё вы открываете. Пусто — выключено.
smart_dns_provider = "https://xbox-dns.ru/dns-query"
# Адрес умного DNS, по той же причине, что doh_bootstrap_ip.
# Узнать адрес: getent ahostsv4 xbox-dns.ru
smart_dns_bootstrap_ip = "111.88.96.56"

# Резолвить адреса для исходящих подключений через DoH.
#
# Выключено по умолчанию — но причина не в DoH, а в провайдере выше.
# Включать имеет смысл, если провайдер подменяет DNS-ответы: тогда
# системному резолверу доверять нельзя. При включении смените doh_provider
# на резолвер с поддержкой ECS, иначе сломаются CDN-домены.
resolve_via_doh = false
strategy_ttl_hours = 24
# Веса функции полезности при выборе между техниками, которые обе работают.
# Применяется только в тщательном проходе, где измеряются все техники сразу;
# быстрый проход по-прежнему берёт первую подходящую.
#
# Надёжность важнее задержки втрое: медленный работающий обход полезнее
# быстрого неработающего. Но при равной надёжности решает скорость —
# disorder, например, платит ретрансмитом в сотни миллисекунд.
reward_reliability = 1.0
reward_latency = 0.3

# Автоматический перезапуск массовой диагностики, часов. 0 — только вручную.
# TTL записи помечает её протухшей, но переизмерить некому, пока не нажмёшь `a`.
auto_diagnostics_hours = 0

# Только диагностика: прокси-слушатели не поднимаются, трафик не меняется.
# Флаг --diagnose-only в командной строке имеет приоритет над этим значением.
diagnostics_only = false

# Пауза между пробами одной техники при диагностике, мс. Наблюдалось, что
# плотная серия проб даёт 0/5 там, где две-три пробы иногда проходят —
# похоже, DPI реагирует на частоту подключений. Меняйте и сравнивайте
# результаты прогонов, чтобы проверить это на своей сети.
probe_gap_min_ms = 250
probe_gap_max_ms = 700

# Блокировать трекеры из block_domains.txt: Яндекс.Метрику, Google Analytics
# и подобные счётчики. Соединение с ними рвётся сразу, до сервера оно не
# доходит — это дешевле, чем пропускать. Правки списка применяются при
# перезапуске прокси.
block_trackers = true


[bypass]
split_pos_min = 4
split_pos_max = 12
split_delay_ms = 3
# 0 = выключено. Ограничивает окно ПРИЁМА, т.е. заставляет сервер слать ответ
# мелкими порциями — техника против DPI, который читает сертификат/ServerHello.
# На SNI в исходящем ClientHello не влияет. Осмысленные значения от ~1000.
window_clamp = 0
# TTL первой половины при disorder: пакет должен пройти DPI, но не дойти
# до сервера. Подбирается под сеть, начинать стоит с 2-4.
disorder_ttl = 2

# Техника fake: перед настоящим ClientHello уходит поддельный, с чужим именем.
#
# Единственная техника, которой не нужен SNI в настоящем пакете — она его не
# прячет, а подделывает. Поэтому только она работает с протоколами без
# открытого имени вообще: подключение по IP, ECH, MTProto у Telegram.
#
# СЕЙЧАС ВЫКЛЮЧЕНА ПОЛНОСТЬЮ — и в диагностике, и в бою, независимо от прав.
# После приманки нужно отмотать номер последовательности (TCP_REPAIR), а ядро
# разрешает это только сокету в состоянии CLOSE, но не живому соединению:
# даже с CAP_NET_ADMIN вызов возвращает EPERM. Заработает, когда появится
# отправка сырых пакетов (NFQUEUE или raw-сокет). Параметры ниже оставлены
# на это время и сейчас ни на что не влияют.
#
# fake_ttl — как у disorder: приманка должна дойти до DPI, но не до сервера.
# fake_sni — имя в подделке. Должно быть заведомо разблокированным: именно
# по нему DPI и классифицирует соединение.
fake_ttl = 2
fake_sni = "www.google.com"

[socks5_junk]
count = 6
size_min = 100
size_max = 800
delay_min_ms = 15
delay_max_ms = 40
# Мусор и перед звонками (экспериментально). DPI оператора узнаёт звонки
# Telegram и WhatsApp по пакетам STUN — служебному протоколу установки
# соединения; сам голос зашифрован без узнаваемой сигнатуры. Мусор перед
# STUN и перед UDP к сетям Telegram сбивает классификацию — тот же приём,
# что --dpi-desync=fake в zapret. Работает, только если оператор режет
# звонки по DPI, а не по IP-адресам, и нужен у ОБОИХ собеседников.
# Звонки не проходят и с этим — попробуйте в Telegram звонки напрямую:
# Конфиденциальность → Звонки → Peer-to-peer. Стало хуже — false.
calls = true
